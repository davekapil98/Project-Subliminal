[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subliminal-robot-brain"
version = "0.1.0"
description = "Stage 0 foundation for the v1.3 public-dataset-first modular SO-101 robot brain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2,<3",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
data = [
  "av>=18,<19",
  "pyarrow>=25,<26",
]
dev = [
  "av>=18,<19",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "pyarrow>=25,<26",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["sim.stage1", "sim.stage1.*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
norecursedirs = ["tests/stage1"]
