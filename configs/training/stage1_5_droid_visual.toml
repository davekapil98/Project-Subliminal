[representation]
view_order = ["exterior_primary", "exterior_secondary", "wrist"]
image_size = 64
target_pool_size = 16
image_range = "float32_0_1"
camera_mask = true
proprio_width = 24
embodiment_token_width = 3
model_proprio_width = 27
proprio_policy = "Pad SO-101 q/qdot/previous_command from 18 to 24, retain DROID width 24, fit normalization on each source training split only, append one-hot dataset/embodiment token."
target_policy = "Frozen seeded random projection of future multi-view 16x16 RGB into four 16D target tokens; no learned target encoder and therefore no collapse shortcut."
target_projection_seed = 1515
action_policy = "No action input. Native Franka and SO-101 actions remain excluded from the shared gate."

[model]
encoder = "TinyJEPAEncoder"
predictor = "JEPALatentPredictor"
image_size = 64
patch_size = 8
max_views = 3
proprio_dim = 27
d_model = 32
depth = 1
num_heads = 4
world_tokens = 4
bus_dim = 16
predictor_depth = 1

[training]
device = "auto"
seeds = [13, 29, 47]
deterministic_algorithms = true
common_pretraining_steps = 300
matched_comparison_steps_per_branch = 240
batch_size = 32
common_pretraining_learning_rate = 0.0003
matched_comparison_learning_rate = 0.0002
gradient_clip_norm = 1.0
baseline_schedule = ["project_ira_so101_v1", "armnetbench_so101_v01"]
treatment_schedule = ["droid_raw_1_0_1", "project_ira_so101_v1", "armnetbench_so101_v01"]
fairness_control = "Branches start from the identical common checkpoint and receive equal updates, batch size, optimizer, learning rate and deterministic sampling budget."

[evaluation]
metric = "source-training-normalized future fixed-target mean squared error"
droid_heldout_split = "test labs: PennPAL and REAL"
diagnostic_droid_split = "validation labs: CLVR and ILIAD"
forgetting_sources = ["project_ira_so101_v1:test", "armnetbench_so101_v01:test"]
forgetting_relative_tolerance = 0.10
minimum_positive_seed_count = 2
admission_rule = "Median DROID test relative improvement must be positive, at least two of three seeds must improve DROID test error, and median relative forgetting on each SO-101 holdout must be <= 0.10."
decision_scope = "A pass admits only action-free DROID visual temporal pretraining for the JEPA encoder. Every other DROID use remains blocked."
