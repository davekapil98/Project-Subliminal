schema_version = 1
stage = "1.5"
protocol_revision = 2
status = "frozen_before_acquisition"
frozen_at = "2026-09-01"
supersedes_protocol_commit = "05fbbc7"
revision_reason = "Four v1-selected DROID episodes had fewer than eight distinct contexts with a decodable future at the frozen 0.5-second horizon, and one IPRL failure-path metadata record declared success. Require path-consistent metadata and at least 22 source trajectory frames before SHA-256 ranking."
gate = "stage1.5_action_free_visual_jepa_value_and_forgetting"
purpose = "Test whether bounded DROID real-Franka video improves action-free temporal visual prediction without degrading frozen real SO-101 visual holdouts."

[scope]
admission_candidate = "jepa_encoder_action_free_temporal_pretraining"
explicitly_excluded_uses = [
  "SO-101 motor targets",
  "SO-101 body dynamics",
  "cross-embodiment native-action mixing",
  "action-conditioned JEPA World admission",
  "Executive admission",
  "Language admission",
]
reason = "DROID native actions and joints are Franka-specific. This first gate tests only source-agnostic visual temporal representation value."

[acquisition]
cap_bytes = 20000000000
minimum_free_reserve_bytes = 5000000000
cap_policy = "The sum of every raw object used by the Stage 1.5 gate, including already-local SO-101 video packs, must be <= cap_bytes. Abort before download otherwise."
raw_policy = "Download immutable objects only; never overwrite; keep raw and prepared caches Git-ignored."
metadata_policy = "Acquire metadata only for selected DROID episodes. The complete 74,896-object metadata namespace is already inventoried; bulk identity-bearing JSON adds no value to this visual gate."
max_workers = 4

[acquisition.pinned_support]
droid_object_manifest = "configs/datasets/registry/droid_raw_1_0_1.objects.json"
droid_object_manifest_sha256 = "e0f8d51151e78387641f8ae1238d5e181887dd6fbfa15d4eee309eb22f6bc69f"
project_ira_registry = "configs/datasets/registry/project_ira_so101_v1.toml"
project_ira_registry_sha256 = "98eb020ae7fc12fa83c219b071c1992106910f3d815027a84329761c6c0fae75"
armnetbench_object_manifest = "configs/datasets/registry/armnetbench_so101_v01.objects.json"
armnetbench_object_manifest_sha256 = "3488221dfc3268e4eefb60950c787728485cdedacb2c2b4d6781faff717dfa44"
policy = "Count the already-pinned license, metadata, episode indices and trajectory tables required to interpret selected video. Deduplicate selected video objects by dataset and path."

[selection.droid]
dataset_id = "droid_raw_1_0_1"
revision = "1.0.1"
algorithm = "Within every frozen lab/outcome cell, exclude Stage 1.4 episodes, require one metadata JSON agreeing with the path lab/outcome and declaring at least minimum_trajectory_frames, one HDF5 trajectory and exactly three non-stereo MP4 cameras, then SHA-256 rank eligible episodes by dataset_id:stage1.5:lab:outcome:source_episode_prefix and select the first quota_per_lab_outcome."
quota_per_lab_outcome = 16
minimum_trajectory_frames = 22
expected_labs = 13
expected_outcomes = ["failure", "success"]
expected_episodes = 416
objects_per_episode = 5
required_objects = ["metadata JSON", "trajectory HDF5", "three non-stereo MP4 cameras"]
stereo_policy = "exclude"
split_key = "collection lab"
samples_per_episode = 8
temporal_horizon_seconds = 0.5

[selection.project_ira]
dataset_id = "project_ira_so101_v1"
revision = "bf6f568e9ec218fff838fb266e161724ec4f7e2c"
train_episode_first = 0
train_episode_last = 89
test_episode_first = 880
test_episode_last = 889
samples_per_episode = 8
train_group = "frozen train task groups; existing packed files"
test_group = "frozen test task group; newly pinned packed files"

[selection.armnetbench]
dataset_id = "armnetbench_so101_v01"
revision = "2e5e89aee0e7f081078d9d6ab3b279fc4b83ea84"
