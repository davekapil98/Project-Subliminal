[splitting]
group_key = "lab"
strategy = "Hold complete collection laboratories out to prevent contributor, scene and hardware leakage. Pair labs to keep validation and test sizes and failure rates near each other and near the global outcome rate."
train_labs = ["AUTOLab", "GuptaLab", "IPRL", "IRIS", "RAD", "RAIL", "RPL", "TRI", "WEIRD"]
validation_labs = ["CLVR", "ILIAD"]
test_labs = ["PennPAL", "REAL"]

