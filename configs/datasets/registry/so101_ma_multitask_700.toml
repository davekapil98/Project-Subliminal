test_block_offset = 0
validation_block_offset = 1
strategy = "Keep each contiguous ten-episode collection block intact; assign one rotating block per task to test, one distinct rotating block to validation and eight blocks to train."

[value_gate]
target_model = "TinyBodyDynamics"
baseline_sources = ["project_ira_so101_v1", "armnetbench_so101_v01"]
treatment_addition = "so101_ma_multitask_700"
held_out_source = "so101_ma_multitask_700:test"
forgetting_sources = ["project_ira_so101_v1:test", "armnetbench_so101_v01:test"]
admission_rule = "Treatment must improve held-out source-normalized next-state error and must not cause more than the configured relative forgetting tolerance on either real SO-101 holdout."

